<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Staff Admin — Samui Luxury Stays</title>
<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
</head>
<body>
<!-- This page loads Decap CMS (free, open-source) from its CDN.
     Staff log in here with the account you invite them with via
     Netlify Identity, then use the form-based panel to add, edit
     or remove villas — no code involved. -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', user => {
      if (!user) {
        window.netlifyIdentity.on('login', () => { document.location.href = '/admin/'; });
      }
    });
  }
</script>
<script>
  /* Let the Media library "Upload" file picker accept several photos at once. */
  try {
    var fixPickers = function () {
      document.querySelectorAll('input[type="file"]').forEach(function (el) {
        if (!el.multiple && !el.hasAttribute('data-single')) { el.multiple = true; }
      });
    };
    new MutationObserver(fixPickers).observe(document.documentElement, { childList: true, subtree: true });
    fixPickers();
  } catch (e) {}
</script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
